spring:
  application:
    name: wtorder-server

  # H2 (개발용 - MySQL 없이도 실행 가능)
  datasource:
    url: jdbc:h2:file:./data/wtorder;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # MySQL (운영용 - 아래 주석 해제 후 사용)
  # datasource:
  #   url: jdbc:mysql://localhost:3306/wtorder?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   username: root
  #   password: root

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
